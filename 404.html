<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting — macunha.me</title>
  </head>
  <body>
    <p>Redirecting to the canonical URL…</p>
    <script>
      (() => {
        const currentPath = window.location.pathname;
        const canonicalPath = currentPath
          .replace(/^\/en\/posts(?=\/|$)/, "/en/post")
          .replace(/^\/posts(?=\/|$)/, "/post")
          .replace(/\/$/, "") || "/";

        if (canonicalPath !== currentPath) {
          window.location.replace(canonicalPath + window.location.search + window.location.hash);
        }
      })();
    </script>
  </body>
</html>
